<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'"><title>Habarnoma · Jamoa javobi</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;color:#203b30;background:#f2f5ef;margin:0}main{max-width:620px;background:#fff;border:1px solid #d4ddcf;border-radius:18px;margin:4vh auto;padding:24px}h1{font-size:30px;line-height:1.15}label{display:block;font-weight:650;margin:14px 0 4px}input,textarea,button{font:inherit;border-radius:8px;padding:9px;border:1px solid #b7c4b5}input,textarea{width:100%}button{background:#285640;color:white;cursor:pointer;margin:12px 4px 0 0}#msg{color:#24553b}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><strong>Habarnoma · Jamoa javobi</strong><h1 id="name"></h1><p id="goal"></p><p>Ulashmoqchi bo‘lgan ishni kiriting. Javobni saqlab yoki ulashib, loyiha egasiga qaytaring.</p><label for="who">Ismingiz yoki manba</label><input maxlength="80" id="who" placeholder="Masalan, Diyor · dizayn"><div id="fields"></div><button id="send">Javobni ulashish</button><button id="download">Javobni JSON olish</button><p role="status" id="msg"></p><textarea id="copy" rows="6" readonly hidden></textarea></main><script>
const project=__PROJECT_DATA__, el=id=>document.getElementById(id);
el('name').textContent=project.name;el('goal').textContent=[project.goal,project.next?'Keyingi vazifa — '+project.next:''].filter(Boolean).join('\n');
const labels=['Bajarildi','Qaror','Fayllar va kod','Ochiq masala','Keyingi qadam'];
labels.forEach((s,i)=>{const l=document.createElement('label'),t=document.createElement('textarea');l.textContent=s;l.htmlFor=t.id='q'+i;t.rows=2;el('fields').append(l,t);});
function note(){const body=labels.map((s,i)=>{const t=el('q'+i).value.trim();return t?s+' — '+t:'';}).filter(Boolean).join('\n\n');if(!body){el('msg').textContent='Kamida bitta bandni yozing.';return;}return {title:project.name+' · Jamoa javobi',source:el('who').value.trim()||'Jamoa',body,at:new Date().toISOString()};}
el('download').onclick=()=>{const n=note();if(!n)return;const blob=new Blob([JSON.stringify({format:'habarnoma-project-v1',project:{...project,notes:[n]}})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habarnoma-javob-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);el('msg').textContent='JSON javobini loyiha egasiga yuboring.';};
el('send').onclick=async()=>{const n=note();if(!n)return;const text=project.name+' · '+n.source+'\n\n'+n.body;if(navigator.share){try{await navigator.share({text});return;}catch(e){if(e.name==='AbortError')return;}}el('copy').value=text;el('copy').hidden=false;el('copy').select();el('msg').textContent='Matnni nusxalab chatga yuboring.';};
</script></html>

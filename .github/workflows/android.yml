name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.9'
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --no-pub --platforms=android --org uz.havola --project-name havola .
          dart tool/prepare_android.dart
          flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Configure Maven Central mirror for the runner
        run: install -Dm644 .github/gradle-ci.init.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/habarnoma.gradle"
      - name: Download verified Gradle distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          distribution="$RUNNER_TEMP/gradle-8.14-bin.zip"
          if ! curl --fail --location --silent --show-error --retry 2 \
            https://downloads.gradle.org/distributions/gradle-8.14-bin.zip --output "$distribution"; then
            gh release download v8.14.0 --repo gradle/gradle-distributions \
              --pattern gradle-8.14-bin.zip --output "$distribution" --clobber
          fi
          echo "61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa  $distribution" | sha256sum --check
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$distribution|" android/gradle/wrapper/gradle-wrapper.properties
      - name: Build and verify APK
        run: |
          flutter build apk --debug
          (cd android && ./gradlew :app:testDebugUnitTest)
          mv build/app/outputs/flutter-apk/app-debug.apk build/Habarnoma.apk
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose build/Habarnoma.apk
      - uses: actions/upload-artifact@v7
        with:
          path: build/Habarnoma.apk
          archive: false
          if-no-files-found: error
